name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: 26.2.x / Java 25
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-26.2.x
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Select canonical node
        run: ./gradlew 'Set active project to 26.2.x'

      - name: Build with Gradle
        run: ./gradlew :26.2.x:build

      - name: Run GameTests
        run: ./gradlew :26.2.x:runGameTestServer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-26.2
          path: versions/26.2.x/build/libs/*.jar
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.node }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 1.21.8
            java: '22'
          - node: 1.21.10
            java: '22'
          - node: 1.21.11
            java: '25'
          - node: 26.1.x
            java: '25'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.node }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select supported node
        run: ./gradlew 'Set active project to ${{ matrix.node }}'

      - name: Test supported node
        run: ./gradlew ':${{ matrix.node }}:build'
