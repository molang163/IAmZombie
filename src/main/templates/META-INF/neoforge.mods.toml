# neoforge.mods.toml — 元数据模板;占位变量由 build.gradle 从 Stonecutter 集中属性展开。

license="${mod_license}"
# A file name (in the root of the mod JAR) containing a logo shown in the mod list.
logoFile="iamzombieq.png"
issueTrackerURL="https://github.com/molang163/IAmZombie/issues"

[[mods]]

modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://github.com/molang163/IAmZombie"
authors="molang163"

description='''
Every survival player is a zombie. Burn, rot, disguise yourself badly, and make
villages regret teaching Steve how to place blocks.
'''

[features.${mod_id}]
javaVersion="${java_version_range}"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
