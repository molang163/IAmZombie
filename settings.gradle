pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'KikuGie Releases'
            url = 'https://maven.kikugie.dev/releases'
        }
        maven {
            name = 'KikuGie Snapshots'
            url = 'https://maven.kikugie.dev/snapshots'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.6'
}

stonecutter {
    // Keep the current Groovy node build intact while using the proven Kotlin controller.
    centralScript = 'build.gradle'
    kotlinController = true

    create(rootProject) {
        version '26.2.x', '26.2'
        version '26.1.x', '26.1'
        version '1.21.11', '1.21.11'
        version '1.21.10', '1.21.10'
        version '1.21.8', '1.21.8'
        vcsVersion = '26.2.x'
    }
}

rootProject.name = 'iamzombieq'
