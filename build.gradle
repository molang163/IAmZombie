import java.nio.file.Files
import java.util.zip.ZipFile

import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction
import org.gradle.work.DisableCachingByDefault

plugins {
    id 'java-library'
    alias(libs.plugins.moddev)
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Keep wrapper downloads binary-only.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude the datagen cache from finalized outputs.
    exclude(".cache/**") // datagen cache files from src/generated/resources
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

def fmlConfigFile = layout.projectDirectory.file('run/config/fml.toml').asFile

def configureDevClientRuntime = tasks.register('configureDevClientRuntime') {
    group = 'mod development'
    description = 'Applies local runtime tweaks needed by the development Minecraft client.'

    doLast {
        def fmlConfig = fmlConfigFile
        fmlConfig.parentFile.mkdirs()

        if (fmlConfig.isFile()) {
            def text = fmlConfig.getText('UTF-8')
            if (text.contains('earlyWindowControl = true')) {
                fmlConfig.setText(text.replace('earlyWindowControl = true', 'earlyWindowControl = false'), 'UTF-8')
            } else if (!text.contains('earlyWindowControl = false')) {
                fmlConfig.append(System.lineSeparator() + 'earlyWindowControl = false' + System.lineSeparator(), 'UTF-8')
            }
        } else {
            fmlConfig.setText('# Local development override for NixOS/Wayland OpenGL startup.' + System.lineSeparator()
                    + 'earlyWindowControl = false' + System.lineSeparator(), 'UTF-8')
        }
    }
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Allow geometry unit tests to bake the official Minecraft client model layers without bootstrapping FML.
    addModdingDependenciesTo(sourceSets.test)
}

tasks.named('runClient').configure {
    dependsOn(configureDevClientRuntime)
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

@DisableCachingByDefault(because = "Verification task has no outputs")
abstract class VerifyManualTestFunctionPackaging extends DefaultTask {
    private static final String ARCHIVE_PREFIX = 'data/iamzombieq/function/test/'

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getArchiveFile()

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDirectory()

    @Internal
    abstract DirectoryProperty getProcessedResourcesDirectory()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getProcessedResourceFiles()

    @Input
    abstract ListProperty<String> getExpectedFunctionNames()

    @TaskAction
    void verifyPackaging() {
        List<String> expectedFiles = expectedFunctionNames.get()
                .collect { "${it}.mcfunction" }
                .sort()
        File sourceRoot = sourceDirectory.get().asFile
        File processedRoot = processedResourcesDirectory.get().asFile

        List<String> sourceFiles = relativeFiles(sourceRoot)
        requireExactFiles('source test-function tree', sourceFiles, expectedFiles)

        File archive = archiveFile.get().asFile
        List<String> packagedEntries = []
        new ZipFile(archive).withCloseable { zip ->
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.name.startsWith(ARCHIVE_PREFIX)) {
                    packagedEntries.add(entry.name)
                }
            }
        }
        packagedEntries.sort()
        if (!packagedEntries.isEmpty()) {
            int packagedFunctionCount = packagedEntries.count { !it.endsWith('/') }
            throw new GradleException("Release JAR must contain 0 entries under ${ARCHIVE_PREFIX}, "
                    + "but found ${packagedEntries.size()} archive entries "
                    + "(${packagedFunctionCount} function files): ${packagedEntries.join(', ')}")
        }
        logger.lifecycle("Verified ${archive}: release entries=0")

        List<String> processedFiles = relativeFiles(processedRoot)
        requireExactFiles('processed test-function tree', processedFiles, expectedFiles)

        for (String relative : expectedFiles) {
            byte[] sourceBytes = Files.readAllBytes(sourceRoot.toPath().resolve(relative))
            byte[] processedBytes = Files.readAllBytes(processedRoot.toPath().resolve(relative))
            if (!Arrays.equals(sourceBytes, processedBytes)) {
                throw new GradleException("Processed test function differs byte-for-byte from source: ${relative}")
            }
        }

        logger.lifecycle("Verified source functions=${sourceFiles.size()}, processed functions=${processedFiles.size()}, "
                + "processed bytes match source")
    }

    private static List<String> relativeFiles(File root) {
        if (!root.isDirectory()) {
            return []
        }

        def rootPath = root.toPath()
        List<String> relative = []
        def paths = Files.walk(rootPath)
        try {
            paths.filter { path -> Files.isRegularFile(path) }
                    .forEach { path ->
                        relative.add(rootPath.relativize(path).toString().replace(File.separator, '/'))
                    }
        } finally {
            paths.close()
        }
        relative.sort()
        return relative
    }

    private static void requireExactFiles(String label, List<String> actual, List<String> expected) {
        if (actual != expected) {
            throw new GradleException("${label} must contain exactly ${expected.size()} files. "
                    + "Expected: ${expected.join(', ')}; actual (${actual.size()}): ${actual.join(', ')}")
        }
    }
}

def manualTestFunctionNames = [
        '_build',
        'kit',
        'plot_arena',
        'plot_coffin',
        'plot_drowning',
        'plot_food',
        'plot_herobrine',
        'plot_mounts',
        'plot_sunlight',
        'setup_all',
]

tasks.named('jar', Jar).configure {
    exclude 'data/iamzombieq/function/test/**'
}

def releaseJar = tasks.named('jar', Jar)
def processedMainResources = tasks.named('processResources', ProcessResources)

def verifyManualTestFunctionPackaging = tasks.register(
        'verifyManualTestFunctionPackaging',
        VerifyManualTestFunctionPackaging) {
    group = 'verification'
    description = 'Verifies manual-test functions stay in dev resources and out of the release JAR.'
    dependsOn(releaseJar, processedMainResources)
    archiveFile.set(releaseJar.flatMap { it.archiveFile })
    sourceDirectory.set(layout.projectDirectory.dir('src/main/resources/data/iamzombieq/function/test'))
    def processedTestFunctionDirectory =
            layout.buildDirectory.dir('resources/main/data/iamzombieq/function/test')
    processedResourcesDirectory.set(processedTestFunctionDirectory)
    processedResourceFiles.from(processedTestFunctionDirectory.map { it.asFileTree })
    expectedFunctionNames.set(manualTestFunctionNames)
}

tasks.named('check').configure {
    dependsOn(verifyManualTestFunctionPackaging)
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
