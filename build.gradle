tasks.named('jar', Jar).configure {
    archiveFileName = "${modId}-${modVersion}+mc${minecraftVersion}.jar"
    exclude 'data/iamzombieq/function/test/**'
}

def releaseJar = tasks.named('jar', Jar)
def processedMainResources = tasks.named('processResources', ProcessResources)

def verifyManualTestFunctionPackaging = tasks.register(
        'verifyManualTestFunctionPackaging',
        VerifyManualTestFunctionPackaging) {
    group = 'verification'
    description = 'Verifies manual-test functions stay in dev resources and out of the release JAR.'
    dependsOn(releaseJar, processedMainResources)
    archiveFile.set(releaseJar.flatMap { it.archiveFile })
    sourceDirectory.set(
            rootProject.layout.projectDirectory.dir('src/main/resources/data/iamzombieq/function/test'))
    def processedTestFunctionDirectory =
            layout.buildDirectory.dir('resources/main/data/iamzombieq/function/test')
    processedResourcesDirectory.set(processedTestFunctionDirectory)
    processedResourceFiles.from(processedTestFunctionDirectory.map { it.asFileTree })
    expectedFunctionNames.set(manualTestFunctionNames)
}

def verifyEntityInteractAbi = tasks.register('verifyEntityInteractAbi', VerifyEntityInteractAbi) {
    group = 'verification'
    description = 'Verifies the release JAR uses the node-native NeoForge entity-interact handlers.'
    dependsOn(releaseJar)
    archiveFile.set(releaseJar.flatMap { it.archiveFile })
    executingNode.set(nodeId)
}

tasks.named('check').configure {
    dependsOn(verifyManualTestFunctionPackaging, verifyEntityInteractAbi)
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraftVersion,
            minecraft_version_range: minecraftVersionRange,
            neo_version            : neoVersion,
            neo_version_range      : neoVersionRange,
            mod_id                 : modId,
            mod_name               : modName,
            mod_license            : modLicense,
            mod_version            : modVersion,
            java_version_range     : migrationJavaVersionRange,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/templates')
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

def generateMigrationRuntimeMatrix = tasks.register(
        'generateMigrationRuntimeMatrix', ProcessResources) {
    def replaceProperties = [
            node_id                    : nodeId,
            runtime_java_features      : migrationRuntimeJavaFeatures.join(', '),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file('src/main/java-templates')
    into layout.buildDirectory.dir('generated/sources/migrationRuntime/java')
}
sourceSets.main.java.srcDir generateMigrationRuntimeMatrix

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release.set(requiredJava)
}

tasks.named('processResources', ProcessResources).configure {
    def mixinJava = "JAVA_${requiredJava}"
    inputs.property('mixinJava', mixinJava)
    inputs.property('playerRendererMixin', playerRendererMixin)
    filesMatching('iamzombieq*.mixins.json') {
        expand(
                mixin_java: mixinJava,
                player_renderer_mixin: playerRendererMixin)
    }

    def humanoidBabyLayer =
            humanoidBabyEquipmentLayerCapability == 'PRESENT' ? ''',
    "humanoid_baby": [
      {
        "texture": "iamzombieq:disguise_mask"
      }
    ]''' : ''
    inputs.property('humanoidBabyLayer', humanoidBabyLayer)
    filesMatching('assets/iamzombieq/equipment/disguise_mask.json') {
        expand(humanoid_baby_layer: humanoidBabyLayer)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Source guards deliberately inspect the active canonical source under the repository root.
    workingDir = rootProject.projectDir
    // Binary-compatibility guards must inspect this node's fresh main output, never a stale root build.
    systemProperty 'iamzombieq.test.mainClassesDir',
            layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
    systemProperty 'iamzombieq.test.nodeId', nodeId
    systemProperty 'iamzombieq.test.build.nodeId', nodeId
    systemProperty 'iamzombieq.test.build.requiredJava', requiredJava
    systemProperty 'iamzombieq.test.runtimeJavaFeature', requiredJava
    systemProperty 'iamzombieq.test.runtimeClasspath',
            sourceSets.test.runtimeClasspath.asPath
    migrationRuntimeJavaFeatures.each { runtimeJava ->
        def runtimeExecutable = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(runtimeJava)
        }.get().executablePath.asFile
        systemProperty "iamzombieq.test.javaExecutable.${runtimeJava}",
                runtimeExecutable.absolutePath
        inputs.file(runtimeExecutable)
                .withPropertyName("iamzombieqJavaExecutable${runtimeJava}")
                .withPathSensitivity(PathSensitivity.NONE)
    }
    systemProperty 'iamzombieq.test.migrationJavaFeatures',
            migrationRuntimeJavaFeatures.join(',')
    systemProperty 'iamzombieq.test.migrationJavaVersionRange',
            migrationJavaVersionRange
    inputs.property('iamzombieqRequiredJava', requiredJava)
    inputs.property('iamzombieqRuntimeJavaFeature', requiredJava)
    inputs.property(
            'iamzombieqMigrationJavaFeatures',
            migrationRuntimeJavaFeatures.join(','))
    inputs.property(
            'iamzombieqMigrationJavaVersionRange',
            migrationJavaVersionRange)
    systemProperty 'iamzombieq.test.platform.nautilus', nautilusCapability
    systemProperty 'iamzombieq.test.platform.submit_node_collector_render_pipeline',
            submitNodeCollectorRenderPipelineCapability
}

migrationRuntimeJavaFeatures
        .findAll { runtimeJava -> runtimeJava != requiredJava }
        .each { runtimeJava ->
            tasks.register("testMigrationJava${runtimeJava}", Test) {
                group = 'verification'
                description = "Runs this node's tests on approved migration Java ${runtimeJava}."
                dependsOn tasks.named('testClasses')
                testClassesDirs = sourceSets.test.output.classesDirs
                classpath = sourceSets.test.runtimeClasspath
                javaLauncher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(runtimeJava)
                }
                systemProperty 'iamzombieq.test.runtimeJavaFeature', runtimeJava
                inputs.property('iamzombieqRuntimeJavaFeature', runtimeJava)
            }
        }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
