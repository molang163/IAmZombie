    into(rootProject.layout.buildDirectory.dir("cross-version-artifacts/${nodeId}"))
}

@DisableCachingByDefault(because = "Verification task has no outputs")
abstract class VerifyManualTestFunctionPackaging extends DefaultTask {
    private static final String ARCHIVE_PREFIX = 'data/iamzombieq/function/test/'

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getArchiveFile()

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDirectory()

    @Internal
    abstract DirectoryProperty getProcessedResourcesDirectory()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getProcessedResourceFiles()

    @Input
    abstract ListProperty<String> getExpectedFunctionNames()

    @TaskAction
    void verifyPackaging() {
        List<String> expectedFiles = expectedFunctionNames.get()
                .collect { "${it}.mcfunction" }
                .sort()
        File sourceRoot = sourceDirectory.get().asFile
        File processedRoot = processedResourcesDirectory.get().asFile

        List<String> sourceFiles = relativeFiles(sourceRoot)
        requireExactFiles('source test-function tree', sourceFiles, expectedFiles)

        File archive = archiveFile.get().asFile
        List<String> packagedEntries = []
        new ZipFile(archive).withCloseable { zip ->
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.name.startsWith(ARCHIVE_PREFIX)) {
                    packagedEntries.add(entry.name)
                }
            }
        }
        packagedEntries.sort()
        if (!packagedEntries.isEmpty()) {
            int packagedFunctionCount = packagedEntries.count { !it.endsWith('/') }
            throw new GradleException("Release JAR must contain 0 entries under ${ARCHIVE_PREFIX}, "
                    + "but found ${packagedEntries.size()} archive entries "
                    + "(${packagedFunctionCount} function files): ${packagedEntries.join(', ')}")
        }
        logger.lifecycle("Verified ${archive}: release entries=0")

        List<String> processedFiles = relativeFiles(processedRoot)
        requireExactFiles('processed test-function tree', processedFiles, expectedFiles)

        for (String relative : expectedFiles) {
            byte[] sourceBytes = Files.readAllBytes(sourceRoot.toPath().resolve(relative))
            byte[] processedBytes = Files.readAllBytes(processedRoot.toPath().resolve(relative))
            if (!Arrays.equals(sourceBytes, processedBytes)) {
                throw new GradleException("Processed test function differs byte-for-byte from source: ${relative}")
            }
        }

        logger.lifecycle("Verified source functions=${sourceFiles.size()}, processed functions=${processedFiles.size()}, "
                + "processed bytes match source")
    }

    private static List<String> relativeFiles(File root) {
        if (!root.isDirectory()) {
            return []
        }

        def rootPath = root.toPath()
        List<String> relative = []
        def paths = Files.walk(rootPath)
        try {
            paths.filter { path -> Files.isRegularFile(path) }
                    .forEach { path ->
                        relative.add(rootPath.relativize(path).toString().replace(File.separator, '/'))
                    }
        } finally {
            paths.close()
        }
        relative.sort()
        return relative
    }

    private static void requireExactFiles(String label, List<String> actual, List<String> expected) {
        if (actual != expected) {
            throw new GradleException("${label} must contain exactly ${expected.size()} files. "
                    + "Expected: ${expected.join(', ')}; actual (${actual.size()}): ${actual.join(', ')}")
        }
    }
}

@DisableCachingByDefault(because = "Verification task has no outputs")
abstract class VerifyEntityInteractAbi extends DefaultTask {
    private static final String SPECIFIC_INTERNAL_NAME =
            'net/neoforged/neoforge/event/entity/player/PlayerInteractEvent$EntityInteractSpecific'
    private static final String GENERAL_HANDLER_DESCRIPTOR =
            '(Lnet/neoforged/neoforge/event/entity/player/PlayerInteractEvent$EntityInteract;)V'
    private static final String SPECIFIC_HANDLER_DESCRIPTOR =
            '(Lnet/neoforged/neoforge/event/entity/player/PlayerInteractEvent$EntityInteractSpecific;)V'
    private static final String HANDLER_CLASS =
            'dev/molang/iamzombieq/gameplay/HerobrineEvents.class'
    private static final String PACKET_OBSERVER_CLASS =
            'dev/molang/iamzombieq/gametest/IAmZombieHerobrineGameTestBodies$HerobrineInteractObserver.class'

    private static int[] countHandlerMethods(byte[] classBytes) {
        DataInputStream input = new DataInputStream(new ByteArrayInputStream(classBytes))
        if (input.readInt() != 0xCAFEBABE as int) {
            throw new GradleException("Invalid class-file magic for ${HANDLER_CLASS}")
        }
        input.readUnsignedShort()
        input.readUnsignedShort()
        int constantPoolCount = input.readUnsignedShort()
        String[] utf8 = new String[constantPoolCount]
        for (int index = 1; index < constantPoolCount; index++) {
            int tag = input.readUnsignedByte()
            switch (tag) {
                case 1:
                    utf8[index] = input.readUTF()
                    break
                case 3:
                case 4:
                    input.skipNBytes(4)
                    break
                case 5:
                case 6:
                    input.skipNBytes(8)
                    index++
                    break
                case 7:
                case 8:
                case 16:
                case 19:
                case 20:
                    input.skipNBytes(2)
                    break
                case 9:
                case 10:
                case 11:
                case 12:
                case 17:
                case 18:
                    input.skipNBytes(4)
                    break
                case 15:
                    input.skipNBytes(3)
                    break
                default:
                    throw new GradleException("Unsupported class-file constant tag ${tag} in ${HANDLER_CLASS}")
            }
        }
        input.skipNBytes(6)
        input.skipNBytes(input.readUnsignedShort() * 2L)
        skipMembers(input, input.readUnsignedShort())

        int generalHandlers = 0
        int specificHandlers = 0
        int methodCount = input.readUnsignedShort()
        for (int index = 0; index < methodCount; index++) {
            input.readUnsignedShort()
            String name = utf8[input.readUnsignedShort()]
            String descriptor = utf8[input.readUnsignedShort()]
            if (name == 'onEntityInteract' && descriptor == GENERAL_HANDLER_DESCRIPTOR) {
                generalHandlers++
            }
            if (name == 'onEntityInteractSpecific' && descriptor == SPECIFIC_HANDLER_DESCRIPTOR) {
                specificHandlers++
            }
            skipAttributes(input, input.readUnsignedShort())
        }
        [generalHandlers, specificHandlers] as int[]
    }

    private static void skipMembers(DataInputStream input, int count) {
        for (int index = 0; index < count; index++) {
            input.skipNBytes(6)
            skipAttributes(input, input.readUnsignedShort())
        }
    }

    private static void skipAttributes(DataInputStream input, int count) {
        for (int index = 0; index < count; index++) {
            input.readUnsignedShort()
            input.skipNBytes(Integer.toUnsignedLong(input.readInt()))
        }
    }

    @Input
    abstract Property<String> getExecutingNode()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getArchiveFile()

    @TaskAction
    void verifyArchive() {
        File archive = archiveFile.get().asFile
        String node = executingNode.get()
        Set<String> knownNodes = ['26.2.x', '26.1.x', '1.21.11', '1.21.10', '1.21.8'] as Set
        if (!knownNodes.contains(node)) {
            throw new GradleException("Unknown Stonecutter node for entity-interact ABI verification: ${node}")
        }
        boolean splitEvents = node != '26.2.x'
        List<String> specificReferences = []
        List<String> specificSymbols = []
        int generalHandlers = 0
        int specificHandlers = 0
        new ZipFile(archive).withCloseable { zip ->
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (!entry.directory && entry.name.endsWith('.class')) {
                    byte[] classBytes
                    zip.getInputStream(entry).withCloseable { input ->
                        classBytes = input.readAllBytes()
                    }
                    String classText = new String(classBytes, StandardCharsets.ISO_8859_1)
                    if (classText.contains(SPECIFIC_INTERNAL_NAME)) {
                        specificReferences.add(entry.name)
                    }
                    if (classText.contains('EntityInteractSpecific')) {
                        specificSymbols.add(entry.name)
                    }
                    if (entry.name == HANDLER_CLASS) {
                        int[] handlerCounts = VerifyEntityInteractAbi.countHandlerMethods(classBytes)
                        generalHandlers = handlerCounts[0]
                        specificHandlers = handlerCounts[1]
                    }
                }
            }
        }
        List<String> expectedSpecificReferences = splitEvents
                ? [HANDLER_CLASS, PACKET_OBSERVER_CLASS].sort()
                : []
        if (specificReferences.sort() != expectedSpecificReferences) {
            throw new GradleException("Release JAR has unexpected ${SPECIFIC_INTERNAL_NAME} references for ${node}. "
                    + "Expected: ${expectedSpecificReferences}; actual: ${specificReferences.sort()}")
        }
        if (!splitEvents && !specificSymbols.isEmpty()) {
            throw new GradleException("Release JAR retains the removed EntityInteractSpecific symbol for ${node}: "
                    + specificSymbols.sort().join(', '))
        }
        int expectedSpecificHandlers = splitEvents ? 1 : 0
        if (generalHandlers != 1 || specificHandlers != expectedSpecificHandlers) {
            throw new GradleException("Release JAR handler ABI mismatch for ${node} in ${HANDLER_CLASS}: "
                    + "general=${generalHandlers} (expected 1), EntityInteractSpecific=${specificHandlers} "
                    + "(expected ${expectedSpecificHandlers})")
        }
        logger.lifecycle("Verified ${archive}: general handlers=1, "
                + "EntityInteractSpecific handlers=${expectedSpecificHandlers}")
    }

}

def manualTestFunctionNames = [
        '_build',
        'kit',
        'plot_arena',
        'plot_coffin',
        'plot_drowning',
        'plot_food',
        'plot_herobrine',
        'plot_mounts',
