// Stonecutter's structured properties are loaded into each node project. Calling the Kotlin
// reified get<T>() method from Groovy is invalid, so use its explicit typed bridge.
def stringKClass = kotlin.jvm.JvmClassMappingKt.getKotlinClass(String.class)
def scProperty = { String name ->
    def value = sc.properties.getTypedImpl(name, stringKClass)
    if (value == null) {
        throw new GradleException("Missing Stonecutter property '${name}' for ${sc.current.project}")
    }
    value as String
}

def modId = scProperty('mod.id')
def modName = scProperty('mod.name')
def modLicense = scProperty('mod.license')
def modVersion = scProperty('mod.version')
def modGroup = scProperty('mod.group')
def minecraftVersion = scProperty('deps.minecraft')
def minecraftVersionRange = scProperty('mod.mc_compat')
def neoVersion = scProperty('deps.neo_loader')
def neoVersionRange = scProperty('deps.neo_range')
def requiredJava = Integer.parseInt(scProperty('build.java'))
def parseJavaFeatures = { String propertyName ->
    def raw = scProperty(propertyName)
    if (!(raw ==~ /[1-9][0-9]*(,[1-9][0-9]*)*/)) {
        throw new GradleException(
                "Invalid ${propertyName} '${raw}' for ${sc.current.project}")
    }
    def features = raw.split(',').collect { Integer.parseInt(it) }
    if (features.toSet().size() != features.size()
            || features != features.sort(false)) {
        throw new GradleException(
                "${propertyName} must be unique and ascending for ${sc.current.project}")
    }
    features.asImmutable()
}
def migrationRuntimeJavaFeatures =
        parseJavaFeatures('migration.java_features')
if (!migrationRuntimeJavaFeatures.contains(requiredJava)) {
    throw new GradleException(
            "build.java ${requiredJava} is outside the migration runtime matrix "
                    + "${migrationRuntimeJavaFeatures} for ${sc.current.project}")
}
def migrationJavaVersionRange = migrationRuntimeJavaFeatures
        .collect { feature -> "[${feature},${feature + 1})" }
        .join(',')
def nautilusCapability = scProperty('platform.nautilus')
if (!(nautilusCapability in ['PRESENT', 'N/A_PLATFORM_ABSENT'])) {
    throw new GradleException(
            "Unknown platform.nautilus '${nautilusCapability}' for ${sc.current.project}")
}
def humanoidBabyEquipmentLayerCapability =
        scProperty('platform.humanoid_baby_equipment_layer')
if (!(humanoidBabyEquipmentLayerCapability in ['PRESENT', 'N/A_PLATFORM_ABSENT'])) {
    throw new GradleException(
            "Unknown platform.humanoid_baby_equipment_layer " +
                    "'${humanoidBabyEquipmentLayerCapability}' for ${sc.current.project}")
}
def submitNodeCollectorRenderPipelineCapability =
        scProperty('platform.submit_node_collector_render_pipeline')
if (!(submitNodeCollectorRenderPipelineCapability in ['PRESENT', 'N/A_PLATFORM_ABSENT'])) {
    throw new GradleException(
            "Unknown platform.submit_node_collector_render_pipeline " +
                    "'${submitNodeCollectorRenderPipelineCapability}' for ${sc.current.project}")
}
def playerRendererMixin = [
        'PRESENT'            : 'client.AvatarRendererMixin',
        'N/A_PLATFORM_ABSENT': 'client.PlayerRendererMixin',
][submitNodeCollectorRenderPipelineCapability]
def nodeId = stonecutter.current.project
def legacyGameTestMixinConfig = [
        '1.21.11': 'iamzombieq.legacy-gametest.mixins.json',
        '1.21.10': 'iamzombieq.legacy-gametest.mixins.json',
        '1.21.8' : 'iamzombieq.legacy-gametest-1.21.8.mixins.json',
][nodeId]

tasks.withType(Wrapper).configureEach {
    // Keep wrapper downloads binary-only.
    distributionType = Wrapper.DistributionType.BIN
}

version = modVersion
group = modGroup

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir(rootProject.file('src/generated/resources'))

    // Exclude the datagen cache from finalized outputs.
    exclude(".cache/**") // datagen cache files from src/generated/resources
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(requiredJava)

neoForge {
    // Specify the version of NeoForge to use.
    version = neoVersion

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
            if (legacyGameTestMixinConfig != null) {
                // CommandLineOptions loads this strict compatibility config only for the mandatory GameTest runner.
                // Ordinary client and dedicated-server launches therefore keep the production mixin set unchanged.
                programArguments.addAll '--mixin', legacyGameTestMixinConfig
            }
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', modId, '--all',
                    '--output', rootProject.file('src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }

    // Allow geometry unit tests to bake the official Minecraft client model layers without bootstrapping FML.
    addModdingDependenciesTo(sourceSets.test)
}

tasks.named('createMinecraftArtifacts').configure {
    dependsOn('stonecutterGenerate')
}

def runClientTask = tasks.named('runClient')
def fmlConfigFile = runClientTask.flatMap { runTask ->
    runTask.gameDirectory.file('config/fml.toml')
}

def configureDevClientRuntime = tasks.register('configureDevClientRuntime') {
    group = 'mod development'
    description = 'Applies local runtime tweaks needed by the development Minecraft client.'

    doLast {
        def fmlConfig = fmlConfigFile.get().asFile
        fmlConfig.parentFile.mkdirs()

        if (fmlConfig.isFile()) {
            def text = fmlConfig.getText('UTF-8')
            if (text.contains('earlyWindowControl = true')) {
                fmlConfig.setText(text.replace('earlyWindowControl = true', 'earlyWindowControl = false'), 'UTF-8')
            } else if (!text.contains('earlyWindowControl = false')) {
                fmlConfig.append(System.lineSeparator() + 'earlyWindowControl = false' + System.lineSeparator(), 'UTF-8')
            }
        } else {
            fmlConfig.setText('# Local development override for NixOS/Wayland OpenGL startup.' + System.lineSeparator()
                    + 'earlyWindowControl = false' + System.lineSeparator(), 'UTF-8')
        }
    }
}

runClientTask.configure {
    dependsOn(configureDevClientRuntime)
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = "Builds and collects the formal JAR for ${nodeId}."
